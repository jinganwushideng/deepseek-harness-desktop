name: Bug report
description: Report a reproducible problem in DeepSeek Harness Desktop
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, credentials, private session content, or personal `.dsh` data.
  - type: input
    id: version
    attributes:
      label: Desktop version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove tokens, credentials, personal paths, and session content before pasting.
      render: text
